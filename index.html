<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SAFE SCHOOL - Section 2</title>

  <style>

    /* =====================================
       RESET
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;

      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #ffffff;
    }


    /* =====================================
       SECTION 2 WRAPPER
    ===================================== */

    .section2-banner {
      position: relative;

      width: 100%;
      max-width: 1800px;

      margin: 0 auto;

      overflow: hidden;

      background: #eef9fb;
    }


    /* =====================================
       IMAGE
       GIỮ NGUYÊN TỶ LỆ
    ===================================== */

    .section2-image {
      display: block;

      width: 100%;
      height: auto;
    }


    /* =====================================
       BUTTON GROUP
    ===================================== */

    .section2-actions {
      position: absolute;

      left: 7%;
      top: 68.2%;

      display: flex;
      align-items: center;

      gap: 12px;

      z-index: 20;
    }


    /* =====================================
       COMMON BUTTON
    ===================================== */

    .section2-btn {
      height:
        clamp(32px, 3.2vw, 48px);

      padding:
        0 clamp(11px, 1.2vw, 18px);

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      border-radius: 999px;

      text-decoration: none;

      white-space: nowrap;

      font-size:
        clamp(7px, .8vw, 12px);

      font-weight: 800;

      line-height: 1;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        border-color .2s ease;
    }


    /* =====================================
       REPORT BUTTON
    ===================================== */

    .section2-btn-report {
      min-width:
        clamp(145px, 16vw, 220px);

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #0fa3a3,
          #078d89
        );

      border:
        2px solid #0fa3a3;

      box-shadow:
        0 6px 16px
        rgba(15, 163, 163, .18);
    }


    /* =====================================
       HELP BUTTON
    ===================================== */

    .section2-btn-help {
      min-width:
        clamp(115px, 12.5vw, 170px);

      color: #102b5a;

      background:
        rgba(255, 255, 255, .97);

      border:
        2px solid #102b5a;

      box-shadow:
        0 6px 16px
        rgba(18, 53, 91, .07);
    }


    /* =====================================
       ICON + ARROW
    ===================================== */

    .btn-icon {
      font-size: .95em;
      line-height: 1;
    }

    .btn-arrow {
      font-size: 1em;
      line-height: 1;
    }


    /* =====================================
       HOVER
    ===================================== */

    .section2-btn:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 10px 22px
        rgba(18, 53, 91, .14);
    }

    .section2-btn-report:hover {
      background: #078d89;
      border-color: #078d89;
    }

    .section2-btn-help:hover {
      background: #f8fbfc;
    }


    /* =====================================
       TABLET
    ===================================== */

    @media (max-width: 1000px) {

      .section2-actions {
        left: 6.9%;
        top: 68%;

        gap: 9px;
      }

      .section2-btn {
        border-width: 1.5px;
      }

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      .section2-actions {
        left: 6.8%;
        top: 68%;

        gap: 5px;
      }

      .section2-btn {
        height: 22px;

        padding:
          0 6px;

        gap: 3px;

        font-size: 5.5px;

        border-width: 1px;
      }

      .section2-btn-report {
        min-width: 96px;
      }

      .section2-btn-help {
        min-width: 73px;
      }

    }

  </style>

</head>


<body>


  <section class="section2-banner">

    <img
      src="1.png"
      alt="You do not have to stay silent"
      class="section2-image"
    >


    <div class="section2-actions">

      <!-- REPORT BUTTON -->
      <a
        href="YOUR-GOOGLE-SITES-REPORT-URL"
        target="_top"
        class="section2-btn section2-btn-report"
      >

        <span class="btn-icon">
          ✈
        </span>

        <span>
          REPORT AN INCIDENT
        </span>

        <span class="btn-arrow">
          →
        </span>

      </a>


      <!-- HELP BUTTON -->
      <a
        href="YOUR-GOOGLE-SITES-GET-HELP-URL"
        target="_top"
        class="section2-btn section2-btn-help"
      >

        <span class="btn-icon">
          ♥
        </span>

        <span>
          I NEED HELP
        </span>

        <span class="btn-arrow">
          →
        </span>

      </a>

    </div>

  </section>


</body>

</html>
